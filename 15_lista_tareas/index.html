<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Lista de tareas</title>
</head>

<body>
    <main class="main">
        <section class="card">
            <h1>Mi lista de tareas</h1>
            <div class="list">
                <div class="item">
                    <input class="check" type="checkbox" id="t1">
                    <label class="task-text" for="t1">Tarea 1</label>
                    <button class="btn-del" type="button">Eliminar</button>
                </div>
            </div>
            <form class="add">
                <input class="input" type="text" placeholder="Ingresa el texto..." />
                <button class="btn-add" type="submit">Agregar</button>
            </form>
        </section>
        <script src="js/tareas.js"></script>
    </main>
</body>

</html>
